name: 카톡 주간 보고 발송

# 매주 월요일 15:00 KST = 06:00 UTC
# 수동 실행도 가능 (workflow_dispatch) — 솔라피 가입 전 mock 모드 점검용
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests

      - name: 솔라피 발송 (자격증명 없으면 mock 모드)
        env:
          SUPABASE_DB_URL:    ${{ secrets.SUPABASE_DB_URL }}
          SOLAPI_API_KEY:     ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET:  ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_PFID:        ${{ secrets.SOLAPI_PFID }}
          SOLAPI_FROM_NUMBER: ${{ secrets.SOLAPI_FROM_NUMBER }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL 미설정 — secret 등록 전까지 skip"
            exit 0
          fi
          python scripts/send_kakao_notify.py
